# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file, builds ./Dockerfile, and prompts for the two
# secrets below (they are never stored in git).
services:
  - type: web
    name: infinity-go
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /stats
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://...@ep-xxx.us-east-2.aws.neon.tech/neondb
      - key: REDIS_URL
        sync: false # Upstash connection string, e.g. rediss://default:...@xxx.upstash.io:6379
      - key: GOMAXPROCS
        value: "1" # free instance is 0.1 CPU; don't let Go size threads off the host's core count
